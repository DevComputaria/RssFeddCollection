name: Download Feeds

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download all feeds
        run: |
          set -e
          YEAR=$(date '+%Y')
          DATETIME=$(date '+%Y-%m-%d_%H-%M-%S')
          BASE_OUTPUT_DIR="rss_downloads"
          YEAR_DIR="$BASE_OUTPUT_DIR/$YEAR"
          OUTPUT_DIR="$YEAR_DIR/$DATETIME"

          mkdir -p "$OUTPUT_DIR"

          while read -r url; do
            timestamp=$(date '+%Y%m%d-%H%M%S') # This timestamp is for the individual file, can be kept or removed if not needed
            sanitized=$(echo "$url" | sed 's/[^A-Za-z0-9]/_/g' | cut -c1-50)
            curl -L "$url" -o "$OUTPUT_DIR/${sanitized}-${timestamp}.xml"
          done < <(grep -Eo 'https?://[^ ]+' feed_list.yaml)
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rss_downloads
          git commit -m "chore: update RSS feeds" || exit 0
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
